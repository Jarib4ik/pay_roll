name: E2E Tests

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 19 * * *'
  # Запуск при создании или обновлении Pull Request
  pull_request:
    branches: [ main, develop ]
    types: [opened, synchronize, reopened]

  # Ручной запуск через GitHub UI
  workflow_dispatch:
    inputs:
      test_marker:
        description: 'Test marker (например: smoke)'
        required: false
        default: ''
      browser:
        description: 'Browser'
        required: false
        default: 'chrome'
        type: choice
        options:
        - chrome
        - firefox
      test_path:
        description: 'Test path (например: tests/test_e2e_scenario/test_login.py)'
        required: false
        default: 'tests/'
      parallel_workers:
        description: 'Number of parallel workers (1-4)'
        required: false
        default: '1'
        type: choice
        options:
        - '1'
        - '2'
        - '3'
        - '4'

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          wget \
          unzip \
          xvfb \
          fonts-liberation \
          libnss3-dev \
          libatk-bridge2.0-dev \
          libdrm2 \
          libxkbcommon-dev \
          libxcomposite-dev \
          libxdamage-dev \
          libxrandr-dev \
          libgbm-dev \
          libxss-dev \
          libasound2-dev

    - name: Install Chrome manually
      run: |
        # Устанавливаем Chrome вручную для совместимости с webdriver-manager
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome-keyring.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Create environment file
      run: |
        cat > .env << 'EOF'
        # API токены
        API_TOKEN=${{ secrets.API_TOKEN }}
        API_KEY=${{ secrets.API_KEY }}

        # Email настройки
        PASSWORD_EMAIL=${{ secrets.PASSWORD_EMAIL }}

        # База данных
        DB_HOST=${{ secrets.DB_HOST }}
        DB_USER=${{ secrets.DB_USER }}
        DB_PASSWORD=${{ secrets.DB_PASSWORD }}
        DB_NAME=${{ secrets.DB_NAME }}
        DB_PORT=${{ secrets.DB_PORT }}

        # SSH туннель (если используется)
        SSH_HOST=${{ secrets.SSH_HOST }}
        SSH_PORT=${{ secrets.SSH_PORT }}
        SSH_USER=${{ secrets.SSH_USER }}
        SSH_PRIVATE_KEY=${{ secrets.SSH_PRIVATE_KEY }}
        SSH_KEY_PASSWORD=${{ secrets.SSH_KEY_PASSWORD }}

        # Test environment settings
        BROWSER=chrome
        HEADLESS=true
        EOF
        
        # Диагностика созданного .env файла
        echo "📄 Проверка созданного .env файла:"
        echo "📋 Размер файла: $(wc -c < .env) байт"
        echo "📋 Количество строк: $(wc -l < .env)"
        
        # Проверяем наличие SSH переменных (без вывода значений)
        echo "🔍 SSH переменные в .env файле:"
        if grep -q "SSH_HOST=" .env; then
          echo "✅ SSH_HOST найден"
        else
          echo "❌ SSH_HOST НЕ найден"
        fi
        
        if grep -q "SSH_USER=" .env; then
          echo "✅ SSH_USER найден"
        else
          echo "❌ SSH_USER НЕ найден"
        fi
        
        if grep -q "SSH_PRIVATE_KEY=" .env; then
          SSH_KEY_LENGTH=$(grep "SSH_PRIVATE_KEY=" .env | cut -d'=' -f2 | wc -c)
          echo "✅ SSH_PRIVATE_KEY найден, длина: $SSH_KEY_LENGTH символов"
          SSH_KEY_CONTENT=$(grep "SSH_PRIVATE_KEY=" .env | cut -d'=' -f2)
          if [[ "$SSH_KEY_CONTENT" == *"-----BEGIN"* ]]; then
            echo "✅ SSH ключ содержит заголовок BEGIN"
          else
            echo "❌ SSH ключ НЕ содержит заголовок BEGIN"
          fi
        else
          echo "❌ SSH_PRIVATE_KEY НЕ найден"
        fi

    - name: Set up display for headless mode
      run: |
        export DISPLAY=:99
        Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
        sleep 3

    - name: Test SSH connection (Debug)
      run: |
        echo "🔍 Тестирование SSH подключения..."
        
        # Проверяем переменные SSH
        echo "📋 SSH переменные:"
        echo "SSH_HOST: ${SSH_HOST:-'НЕТ'}"
        echo "SSH_PORT: ${SSH_PORT:-'НЕТ'}"
        echo "SSH_USER: ${SSH_USER:-'НЕТ'}"
        echo "SSH_PRIVATE_KEY установлен: $([[ -n \"${SSH_PRIVATE_KEY:-}\" ]] && echo \"ДА\" || echo \"НЕТ\")"
        
        if [[ -n "${SSH_HOST:-}" ]]; then
          # Проверяем DNS разрешение
          echo "🔍 DNS разрешение для $SSH_HOST:"
          if nslookup "$SSH_HOST"; then
            echo "✅ DNS разрешение успешно"
          else
            echo "❌ DNS разрешение не удалось"
          fi
          
          # Проверяем доступность порта
          SSH_PORT_TO_CHECK="${SSH_PORT:-22}"
          echo "🔍 Проверка доступности $SSH_HOST:$SSH_PORT_TO_CHECK"
          if timeout 10 bash -c "</dev/tcp/$SSH_HOST/$SSH_PORT_TO_CHECK"; then
            echo "✅ Порт $SSH_PORT_TO_CHECK доступен"
          else
            echo "❌ Порт $SSH_PORT_TO_CHECK НЕ доступен"
          fi
          
          # Пробуем SSH подключение с детальным логом
          echo "🔍 Тестовое SSH подключение (с детальным выводом):"
          if [[ -n "${SSH_PRIVATE_KEY:-}" ]]; then
            # Создаем временный файл для ключа
            echo "$SSH_PRIVATE_KEY" > /tmp/ssh_test_key
            chmod 600 /tmp/ssh_test_key
            
            echo "🔑 SSH ключ создан, размер: $(wc -c < /tmp/ssh_test_key) байт"

            # Тестируем SSH подключение
            ssh -vvv \
              -i /tmp/ssh_test_key \
              -o ConnectTimeout=10 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -p "${SSH_PORT:-22}" \
              "${SSH_USER}@${SSH_HOST}" \
              "echo 'SSH подключение успешно'" || echo "❌ SSH подключение не удалось"
            
            # Удаляем временный ключ
            rm -f /tmp/ssh_test_key
          else
            echo "❌ SSH_PRIVATE_KEY не установлен, пропускаем тест подключения"
          fi
        else
          echo "❌ SSH_HOST не установлен, пропускаем тест SSH"
        fi
      env:
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_PORT: ${{ secrets.SSH_PORT }}
        SSH_USER: ${{ secrets.SSH_USER }}
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SSH_KEY_PASSWORD: ${{ secrets.SSH_KEY_PASSWORD }}

    - name: Run tests
      run: |
        # Проверяем установку Chrome
        echo "🔍 Проверка установки Chrome:"
        google-chrome --version
        
        # Проверяем переменные окружения
        echo "🔍 Переменные окружения:"
        echo "HEADLESS: $HEADLESS"
        echo "DISPLAY: $DISPLAY"
        
        # Проверяем SSH настройки (без вывода секретов)
        echo "🔍 SSH настройки:"
        echo "SSH_HOST настроен: $([[ -n \"${SSH_HOST:-}\" ]] && echo \"Да\" || echo \"Нет\")"
        echo "SSH_USER настроен: $([[ -n \"${SSH_USER:-}\" ]] && echo \"Да\" || echo \"Нет\")"
        echo "SSH_PRIVATE_KEY настроен: $([[ -n \"${SSH_PRIVATE_KEY:-}\" ]] && echo \"Да\" || echo \"Нет\")"
        
        # Определяем параметры запуска
        TEST_MARKER="${{ github.event.inputs.test_marker }}"
        TEST_PATH="${{ github.event.inputs.test_path || 'tests/' }}"
        PARALLEL_WORKERS="${{ github.event.inputs.parallel_workers || '1' }}"
        
        # Формируем команду pytest с настраиваемым количеством потоков
        PYTEST_CMD="pytest"
        
        if [ ! -z "$TEST_MARKER" ]; then
          PYTEST_CMD="$PYTEST_CMD -m $TEST_MARKER"
        fi
        
        PYTEST_CMD="$PYTEST_CMD $TEST_PATH"
        PYTEST_CMD="$PYTEST_CMD --alluredir=allure-results"
        PYTEST_CMD="$PYTEST_CMD --tb=short"
        PYTEST_CMD="$PYTEST_CMD -v"
        
        # Добавляем параллельность только если workers > 1
        if [ "$PARALLEL_WORKERS" -gt 1 ]; then
          PYTEST_CMD="$PYTEST_CMD -n $PARALLEL_WORKERS"  # Параллельное выполнение
          PYTEST_CMD="$PYTEST_CMD --dist=loadfile"       # Распределение тестов по файлам
          echo "⚡ Включен параллельный режим: $PARALLEL_WORKERS потоков"
        else
          PYTEST_CMD="$PYTEST_CMD -s"  # Capture=no только для одного потока
          echo "🔍 Включен отладочный режим: 1 поток с выводом в консоль"
        fi
        
        echo "🚀 Запуск тестов: $PYTEST_CMD"
        if [ "$PARALLEL_WORKERS" -gt 1 ]; then
          echo "🔄 Параллельное выполнение в $PARALLEL_WORKERS потоках (pytest-xdist)"
        else
          echo "🔄 Последовательное выполнение (1 поток)"
        fi
        echo "📋 webdriver-manager автоматически установит нужную версию ChromeDriver"
        
        # Сначала запускаем API тесты (быстрые)
        echo "🚀 Запуск API тестов (быстрые тесты без WebDriver)..."
        set +e
        pytest tests/test_api_basic.py -v --tb=short --alluredir=allure-results/api 2>&1 | tee api_tests_output.log
        API_TESTS_EXIT_CODE=$?
        set -e
        echo "📊 API тесты завершены с кодом: $API_TESTS_EXIT_CODE"
        
        # Затем запускаем основные тесты
        echo "🚀 Запуск основных тестов..."
        set +e  # Не останавливаемся при ошибке pytest
        $PYTEST_CMD 2>&1 | tee pytest_output.log
        PYTEST_EXIT_CODE=$?
        set -e  # Возвращаем строгий режим
        
        echo "📊 Pytest завершен с кодом: $PYTEST_EXIT_CODE"
        echo "📊 API тесты завершены с кодом: $API_TESTS_EXIT_CODE"
        
        # Определяем общий статус (ошибка если хотя бы один тест провалился)
        OVERALL_EXIT_CODE=0
        if [ $API_TESTS_EXIT_CODE -ne 0 ] || [ $PYTEST_EXIT_CODE -ne 0 ]; then
          OVERALL_EXIT_CODE=1
        fi
        echo "📊 Общий код завершения: $OVERALL_EXIT_CODE"
      env:
        DISPLAY: :99
        BROWSER: ${{ github.event.inputs.browser || 'chrome' }}
        HEADLESS: true
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_PORT: ${{ secrets.SSH_PORT }}
        SSH_USER: ${{ secrets.SSH_USER }}
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SSH_KEY_PASSWORD: ${{ secrets.SSH_KEY_PASSWORD }}

    - name: Generate Allure Report
      if: always()
      run: |
        # Устанавливаем Allure
        wget https://github.com/allure-framework/allure2/releases/download/2.24.0/allure-2.24.0.tgz
        tar -zxvf allure-2.24.0.tgz
        sudo mv allure-2.24.0 /opt/allure
        sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure
        
        # Генерируем отчет
        allure generate allure-results --clean -o allure-report

    - name: Upload Allure Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-results
        path: allure-results/
        retention-days: 7

    - name: Upload Allure Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: allure-report/
        retention-days: 7

    - name: Upload Screenshots on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: screenshots/
        retention-days: 3

    - name: Send test results to Telegram
      if: always()
      run: |
        # Парсим результаты из pytest output
        echo "🎯 Анализ результатов pytest..."
        
        PASSED=0
        FAILED=0
        SKIPPED=0
        ERRORS=0
        DURATION_SECONDS=""
        DURATION_HUMAN=""
        
        # Переменные для API тестов
        API_PASSED=0
        API_FAILED=0
        API_SKIPPED=0
        API_DURATION=""
        
        # Сначала парсим API тесты
        if [ -f "api_tests_output.log" ]; then
          echo "📄 Найден файл api_tests_output.log"
          API_SUMMARY_LINE=$(grep -E "={6,}.*in [0-9.]+s.*={6,}" api_tests_output.log | tail -1)
          echo "📊 API статистика: $API_SUMMARY_LINE"
          
          if [ -n "$API_SUMMARY_LINE" ]; then
            API_PASSED=$(echo "$API_SUMMARY_LINE" | grep -o '[0-9]\+ passed' | grep -o '[0-9]\+' || echo "0")
            API_FAILED=$(echo "$API_SUMMARY_LINE" | grep -o '[0-9]\+ failed' | grep -o '[0-9]\+' || echo "0")
            API_SKIPPED=$(echo "$API_SUMMARY_LINE" | grep -o '[0-9]\+ skipped' | grep -o '[0-9]\+' || echo "0")
            API_DURATION=$(echo "$API_SUMMARY_LINE" | grep -o 'in [0-9.]\+s' | grep -o '[0-9.]\+')
            
            echo "📈 API результаты: Passed=$API_PASSED, Failed=$API_FAILED, Skipped=$API_SKIPPED"
          fi
        fi

        # Проверяем наличие файла с выводом pytest
        if [ -f "pytest_output.log" ]; then
          echo "📄 Найден файл pytest_output.log"
          echo "📋 Последние строки pytest вывода:"
          tail -10 pytest_output.log
          echo ""
          
          # Ищем строку с итоговой статистикой pytest
          # Примеры: "====== 1 passed in 13.72s ======"
          #         "====== 2 failed, 1 passed in 15.32s ======"
          #         "====== 7 failed, 35 passed in 2953.28s (0:49:13) ======"
          SUMMARY_LINE=$(grep -E "={6,}.*in [0-9.]+s.*={6,}" pytest_output.log | tail -1)
          echo "📊 Найдена строка статистики: $SUMMARY_LINE"
          
          if [ -n "$SUMMARY_LINE" ]; then
            # Извлекаем числа для каждого статуса
            PASSED=$(echo "$SUMMARY_LINE" | grep -o '[0-9]\+ passed' | grep -o '[0-9]\+' || echo "0")
            FAILED=$(echo "$SUMMARY_LINE" | grep -o '[0-9]\+ failed' | grep -o '[0-9]\+' || echo "0")
            SKIPPED=$(echo "$SUMMARY_LINE" | grep -o '[0-9]\+ skipped' | grep -o '[0-9]\+' || echo "0")
            ERRORS=$(echo "$SUMMARY_LINE" | grep -o '[0-9]\+ error' | grep -o '[0-9]\+' || echo "0")
            
            # Извлекаем время выполнения
            # Ищем паттерн "in XXX.XXs" или "in XXX.XXs (H:MM:SS)"
            DURATION_SECONDS=$(echo "$SUMMARY_LINE" | grep -o 'in [0-9.]\+s' | grep -o '[0-9.]\+')
            echo "⏱️ Время выполнения (секунды): $DURATION_SECONDS"
            
            # Ищем человеко-читаемое время в скобках
            DURATION_HUMAN=$(echo "$SUMMARY_LINE" | grep -o '([0-9:]\+)' | tr -d '()')
            echo "🕒 Время выполнения (читаемое): $DURATION_HUMAN"
            
            # Если нашли только число без статуса (например "1 passed"), парсим по-другому
            if [ "$PASSED" = "0" ] && [ "$FAILED" = "0" ] && [ "$SKIPPED" = "0" ]; then
              if echo "$SUMMARY_LINE" | grep -q " passed"; then
                PASSED=$(echo "$SUMMARY_LINE" | grep -o '^[^=]*[0-9]\+' | grep -o '[0-9]\+' || echo "0")
              elif echo "$SUMMARY_LINE" | grep -q " failed"; then
                FAILED=$(echo "$SUMMARY_LINE" | grep -o '^[^=]*[0-9]\+' | grep -o '[0-9]\+' || echo "0")
              fi
            fi
            
            echo "📈 Результаты из pytest: Passed=$PASSED, Failed=$FAILED, Skipped=$SKIPPED, Errors=$ERRORS"
          else
            echo "❌ Не найдена строка с итоговой статистикой pytest"
          fi
        else
          echo "❌ Файл pytest_output.log не найден"
        fi
        
        # Объединяем failed и errors
        TOTAL_FAILED=$((FAILED + ERRORS))
        TOTAL=$((PASSED + TOTAL_FAILED + SKIPPED))
        
        # Объединяем статистики API и основных тестов
        COMBINED_PASSED=$((PASSED + API_PASSED))
        COMBINED_FAILED=$((TOTAL_FAILED + API_FAILED))
        COMBINED_SKIPPED=$((SKIPPED + API_SKIPPED))
        COMBINED_TOTAL=$((COMBINED_PASSED + COMBINED_FAILED + COMBINED_SKIPPED))
        
        echo "📊 Основные тесты: Passed=$PASSED, Failed=$TOTAL_FAILED, Skipped=$SKIPPED, Total=$TOTAL"
        echo "📊 API тесты: Passed=$API_PASSED, Failed=$API_FAILED, Skipped=$API_SKIPPED"
        echo "📊 Общая статистика: Passed=$COMBINED_PASSED, Failed=$COMBINED_FAILED, Skipped=$COMBINED_SKIPPED, Total=$COMBINED_TOTAL"
        
        # Форматируем время выполнения для отображения
        DURATION_DISPLAY=""
        if [ -n "$DURATION_SECONDS" ]; then
          echo "⏱️ Обработка времени выполнения..."
          
          # Если есть человеко-читаемое время, используем его
          if [ -n "$DURATION_HUMAN" ]; then
            DURATION_DISPLAY="$DURATION_HUMAN"
            echo "🕒 Используем читаемое время: $DURATION_DISPLAY"
          else
            # Иначе форматируем из секунд
            SECONDS_INT=$(echo "$DURATION_SECONDS" | cut -d. -f1)
            
            if [ "$SECONDS_INT" -ge 3600 ]; then
              # Более часа
              HOURS=$((SECONDS_INT / 3600))
              MINUTES=$(((SECONDS_INT % 3600) / 60))
              SECS=$((SECONDS_INT % 60))
              DURATION_DISPLAY="${HOURS}:$(printf "%02d" $MINUTES):$(printf "%02d" $SECS)"
            elif [ "$SECONDS_INT" -ge 60 ]; then
              # Более минуты
              MINUTES=$((SECONDS_INT / 60))
              SECS=$((SECONDS_INT % 60))
              DURATION_DISPLAY="${MINUTES}:$(printf "%02d" $SECS)"
            else
              # Менее минуты
              DURATION_DISPLAY="${DURATION_SECONDS}s"
            fi
            echo "🕒 Сформатированное время: $DURATION_DISPLAY"
          fi
          
          # Добавляем исходное время в секундах для точности
          DURATION_DISPLAY="$DURATION_DISPLAY (${DURATION_SECONDS}s)"
        else
          echo "⚠️ Время выполнения не найдено"
        fi
        
        # Если pytest парсинг не дал результатов, используем Allure как fallback
        if [ $TOTAL -eq 0 ]; then
          echo "🔄 Pytest парсинг не дал результатов, используем Allure как fallback..."
          
          # Allure fallback логика
          if [ -d "allure-results" ]; then
            echo "📁 Найдена папка allure-results"
            
            # Ищем все JSON файлы с результатами
            for result_file in allure-results/*-result.json; do
              if [ -f "$result_file" ]; then
                echo "🔍 Обрабатываем файл: $result_file"
                # Извлекаем статус из JSON
                STATUS=$(grep -o '"status":"[^"]*"' "$result_file" | cut -d'"' -f4)
                echo "📊 Найден статус: $STATUS"
                
                case "$STATUS" in
                  "passed") PASSED=$((PASSED + 1)) ;;
                  "failed") TOTAL_FAILED=$((TOTAL_FAILED + 1)) ;;
                  "skipped") SKIPPED=$((SKIPPED + 1)) ;;
                  "broken") TOTAL_FAILED=$((TOTAL_FAILED + 1)) ;;
                  *) echo "⚠️ Неизвестный статус: $STATUS" ;;
                esac
              fi
            done
            
            TOTAL=$((PASSED + TOTAL_FAILED + SKIPPED))
            echo "📈 Результаты из Allure fallback: Passed=$PASSED, Failed=$TOTAL_FAILED, Skipped=$SKIPPED, Total=$TOTAL"
          else
            echo "❌ Папка allure-results не найдена"
          fi
        fi
        
        # Если все еще нет результатов, показываем сообщение об ошибке
        if [ $TOTAL -eq 0 ]; then
          echo "⚠️ Не удалось получить результаты тестов ни из pytest, ни из Allure"
        fi
        
        # Определяем статус на основе общей статистики
        if [ $COMBINED_FAILED -gt 0 ]; then
          STATUS="❌ FAILED"
          STATUS_EMOJI="🔴"
        elif [ $COMBINED_PASSED -gt 0 ]; then
          STATUS="✅ PASSED"
          STATUS_EMOJI="🟢"
        else
          STATUS="⚪ NO TESTS"
          STATUS_EMOJI="⚪"
        fi
        
        # Формируем сообщение
        if [ $COMBINED_TOTAL -gt 0 ]; then
          # Добавляем время выполнения в сообщение если оно доступно
          DURATION_LINE=""
          if [ -n "$DURATION_DISPLAY" ]; then
            DURATION_LINE="⏱️ Время выполнения: \`${DURATION_DISPLAY}\`"
          fi
          
          MESSAGE="${STATUS_EMOJI} Результаты автотестов Pay-Roll

          📊 Общая статистика:
          ✅ Прошли: ${COMBINED_PASSED}
          ❌ Упали: ${COMBINED_FAILED}
          ⏭️ Пропущены: ${COMBINED_SKIPPED}
          📈 Всего: ${COMBINED_TOTAL}
          
          🔗 API тесты: ${API_PASSED} прошли, ${API_FAILED} упали
          🖥️ UI тесты: ${PASSED} прошли, ${TOTAL_FAILED} упали
          ${DURATION_LINE}

          🔧 Детали:
          📦 Репозиторий: ${GITHUB_REPOSITORY}
          🌿 Ветка: ${GITHUB_REF_NAME}
          💻 Коммит: ${GITHUB_SHA:0:8}
          🚀 Запуск: #${GITHUB_RUN_NUMBER}

          📋 Ссылка: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          else
          # Добавляем время выполнения в сообщение об ошибке если оно доступно
          DURATION_LINE=""
          if [ -n "$DURATION_DISPLAY" ]; then
            DURATION_LINE="⏱️ Время выполнения: \`${DURATION_DISPLAY}\`"
          fi
          
          MESSAGE="⚠️ Результаты автотестов

          ❌ Не удалось получить результаты тестов
          ${DURATION_LINE}
          📦 Репозиторий: ${GITHUB_REPOSITORY}
          🌿 Ветка: ${GITHUB_REF_NAME}
          🚀 Запуск: #${GITHUB_RUN_NUMBER}

          📋 Ссылка: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
        
        # Отправляем сообщение в Telegram
        echo "📤 Отправка сообщения в Telegram..."
        if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
          echo "❌ TELEGRAM_BOT_TOKEN не установлен"
        elif [ -z "$TELEGRAM_CHAT_ID" ]; then
          echo "❌ TELEGRAM_CHAT_ID не установлен"
        else
          echo "✅ Telegram секреты настроены"
          
          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "disable_web_page_preview=true")
          
          echo "📥 Ответ Telegram API: $RESPONSE"
          
          # Проверяем успешность отправки
          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "✅ Сообщение успешно отправлено в Telegram"
          else
            echo "❌ Ошибка отправки в Telegram"
            echo "🔍 Детали ответа: $RESPONSE"
          fi
        fi
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
